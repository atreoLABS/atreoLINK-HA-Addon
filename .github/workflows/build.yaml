name: Build add-on image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (must match config.yaml version, e.g. 0.1.0)"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/atreolabs/atreolink-ha-addon

jobs:
  # Gate the publish on the security pipeline (gitleaks + Trivy). Reuses
  # security.yml so there is a single scan definition; the image is only built
  # and pushed if every blocking scan passes.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      packages: read

  build:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Releases (tag pushes and manual dispatch) publish the version tag the
      # Supervisor pulls, and move `latest`. Pushes to main publish only a
      # moving `main` tag for testing, so a dev build can never become what a
      # release install pulls.
      - name: Resolve image tags
        id: meta
        run: |
          {
            echo "tags<<EOF"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "${IMAGE}:${{ github.event.inputs.version }}"
              echo "${IMAGE}:latest"
            elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${IMAGE}:${GITHUB_REF_NAME#v}"
              echo "${IMAGE}:latest"
            else
              echo "${IMAGE}:main"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Repo root so the Dockerfile can COPY custom_components/ into the image.
          context: .
          file: image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
